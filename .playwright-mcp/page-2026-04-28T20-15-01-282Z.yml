      - generic [ref=e62]:
        - paragraph [ref=e63]: It was early in the morning when we entered Volcanoes National Park. The mist still hung low over the hills as our ranger pointed us in the direction of the Susa group — one of the largest gorilla families in Rwanda.
        - heading "The draw" [level=2] [ref=e64]
        - paragraph [ref=e65]: After two hours of walking through dense bamboo forest, suddenly a sound right next to the path. Our guide put his hand on my arm and pointed. There, just three meters away, a young gorilla sat quietly eating leaves. My heart stood still.
        - heading "The hour with the gorillas" [level=2] [ref=e66]
        - paragraph [ref=e67]: You have exactly one hour in the presence of the gorillas. It seemed both an eternity and a second. The silverback lay lazily on his back as the young clambered over him. No zoo, no documentary can prepare for this.
        - heading "Practical information" [level=2] [ref=e68]
        - paragraph [ref=e69]: A gorilla trekking permit costs $1500 per person. This directly contributes to the protection of the gorillas and the local community. The trekking takes 2-8 hours depending on where the gorillas are located. Good fitness is a requirement.
